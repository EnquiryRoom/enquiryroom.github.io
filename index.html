<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Enquiry Room — Coming Soon</title>
  <meta name="description" content="Interactive history case files for ages 11–16. Real primary sources. Real historical mysteries. Launching soon.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><circle cx='12' cy='12' r='10' fill='%238b1a1a' stroke='%23ffd166' stroke-width='1.5'/><text x='12' y='15.5' font-family='Georgia' font-size='7' font-weight='700' fill='%23ffd166' text-anchor='middle'>?</text><line x1='20' y1='20' x2='26' y2='26' stroke='%23ffd166' stroke-width='2.5' stroke-linecap='round'/><circle cx='18' cy='18' r='5' fill='none' stroke='%23ffd166' stroke-width='2'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Merriweather:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;overflow-x:hidden;}
    body{
      font-family:'Nunito',sans-serif;
      background:#0e1a2e;
      color:#fff;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:2rem 1.5rem;
      position:relative;
    }
    body::before{
      content:'?';
      position:fixed;
      right:-60px;bottom:-80px;
      font-family:'Merriweather',Georgia,serif;
      font-size:400px;font-weight:700;
      color:rgba(255,255,255,0.025);
      line-height:1;pointer-events:none;
    }
    body::after{
      content:'';
      position:fixed;
      top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,#8b1a1a,#ffd166,#1a6fc4);
    }
    .container{
      max-width:480px;width:100%;
      text-align:center;
      position:relative;z-index:1;
    }
    .logo{
      display:inline-flex;align-items:center;gap:0.6rem;
      margin-bottom:3rem;
    }
    .logo-text{font-size:1rem;font-weight:900;color:#fff;}
    .logo-text span{color:#ffd166;}
    h1{
      font-family:'Merriweather',Georgia,serif;
      font-size:clamp(2.2rem,8vw,3.2rem);
      font-weight:700;line-height:1.15;
      margin-bottom:0.6rem;
    }
    h1 em{font-style:italic;color:#ffd166;}
    .sub{
      font-size:1rem;
      color:rgba(255,255,255,0.55);
      margin-bottom:2.5rem;
      line-height:1.6;
    }
    .features{
      display:flex;flex-wrap:wrap;
      gap:0.5rem;justify-content:center;
      margin-bottom:3rem;
    }
    .feature{
      font-size:0.76rem;font-weight:700;
      color:rgba(255,255,255,0.6);
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:30px;
      padding:0.3rem 0.8rem;
    }
    .footer{
      font-size:0.75rem;
      color:rgba(255,255,255,0.2);
    }
    .footer a{
      color:rgba(255,255,255,0.3);
      text-decoration:none;
    }
    .footer a:hover{color:rgba(255,255,255,0.6);}
  </style>
</head>
<body>
<div class="container">

  <div class="logo">
    <svg width="32" height="32" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" fill="#8b1a1a" stroke="#ffd166" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="#ffd166" stroke-width="0.8" stroke-dasharray="2 1.5"/>
      <text x="12" y="15.5" font-family="Georgia,serif" font-size="7" font-weight="700" fill="#ffd166" text-anchor="middle">?</text>
      <line x1="20" y1="20" x2="26" y2="26" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="18" cy="18" r="5" fill="none" stroke="#ffd166" stroke-width="2"/>
    </svg>
    <span class="logo-text">The Enquiry <span>Room</span></span>
  </div>

  <h1>History on <em>Trial.</em></h1>
  <p class="sub">Real primary sources. Real historical mysteries.<br>Coming soon.</p>

  <div class="features">
    <span class="feature">📜 Real documents</span>
    <span class="feature">⚖️ You decide</span>
    <span class="feature">🎓 Ages 11–16</span>
    <span class="feature">🏠 Home education</span>
  </div>

  <div class="footer">
    <a href="mailto:hello@theenquiryroom.co.uk">hello@theenquiryroom.co.uk</a>
  </div>

</div>
</body>
</html>
